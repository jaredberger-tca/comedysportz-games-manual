name: Sync Games from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-games
  cancel-in-progress: true

jobs:
  sync-games:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync games from Google Sheets
        run: npm run sync-games

      - name: Test build
        run: npm run build

      - name: Commit updated games data
        run: |
          if git diff --quiet src/data/games.json; then
            echo "No game data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/games.json
            git commit -m "Sync games from Google Sheets"
            git push
          fi
